# ZHEXU: this file differs from upstream. Issues opened in this repository are
# about what it adds (the extension, the theme, the showcase page). Anything
# that also applies to OpenMAIC without the extension is sent upstream, where
# everyone gets the fix.
blank_issues_enabled: true
contact_links:
  - name: Bug in OpenMAIC itself
    url: https://github.com/THU-MAIC/OpenMAIC/issues/new?template=bug_report.yml
    about: A bug that also happens without the ZHEXU extension belongs upstream, where everyone gets the fix
  - name: Question or idea about OpenMAIC itself
    url: https://github.com/THU-MAIC/OpenMAIC/discussions
    about: How to use or deploy the classroom, and ideas for it, are discussed in upstream's Discussions
  - name: Security vulnerability in OpenMAIC
    url: https://github.com/THU-MAIC/OpenMAIC/security/advisories/new
    about: Privately report a vulnerability in OpenMAIC to its maintainers instead of opening a public issue
